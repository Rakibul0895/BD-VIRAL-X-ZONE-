<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Video Hub</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ১৮+ ভেরিফিকেশন পপ-আপ -->
  <div id="age-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="age-icon">🔞</div>
      <h2>VERIFY YOUR AGE</h2>
      <p>আপনার বয়স ১৮ বছরের বেশি হলে নিচের ভেরিফিকেশন বাটন ক্লিক করুন 👇👇👇👇⚠️</p>
      <button id="enter-btn" class="verify-btn">✅ I AM 18+ & ENTER</button>
    </div>
  </div>

  <!-- মূল অ্যাপ কন্টেন্ট (যা পপ-আপের পর দেখাবে) -->
  <div id="app-content" class="hidden">
    <header class="header">
      <h2>Video Hub</h2>
    </header>

    <!-- ক্যাটাগরি বাটন -->
    <div class="categories">
      <button class="cat-btn active">🌐 সবগুলো</button>
      <button class="cat-btn">🔥 ট্রেন্ডিং</button>
      <button class="cat-btn">🇷🇺 রাশিয়ান</button>
      <button class="cat-btn">🇧🇩 দেশী</button>
    </div>

    <!-- ভিডিও গ্রিড -->
    <div class="video-grid">
      <div class="video-card">
        <img src="https://via.placeholder.com/300x200" alt="Thumb">
        <h3>ট্রেন্ডিং ভিডিও - সবার সেরা</h3>
        <button onclick="openLink('https://t.me/your_channel')">▶ দেখুন</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
