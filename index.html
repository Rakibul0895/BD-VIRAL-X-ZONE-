<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Video X Zone</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 15px;
    }
    .header {
      text-align: center;
      padding: 15px 0;
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }
    .sub-header {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .video-card {
      background: #1e293b;
      border: 2px solid #e11d48;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .video-card h3 {
      margin-bottom: 10px;
      color: #f43f5e;
      font-size: 18px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="header">🎬 Premium Video Hub</div>
  <div class="sub-header">আপনার পছন্দের ভিডিও প্লে করে উপভোগ করুন</div>

  <!-- ভিডিও ১ -->
  <div class="video-card">
    <h3>🔥 সেলিব্রিটি ভাইরাল ভিডিও </h3>
    <video controls poster="https://via.placeholder.com/400x220">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      আপনার ব্রাউজারে ভিডিও প্লে হচ্ছে না।
    </video>
  </div>

  <!-- ভিডিও ২ -->
  <div class="video-card">
    <h3>⭐ ইংলিশ ভিডিও ২</h3>
    <video controls poster="https://via.placeholder.com/400x220">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      আপনার ব্রাউজারে ভিডিও প্লে হচ্ছে না।
    </video>
  </div>

  <script>
    // টেলিগ্রাম WebApp ফুলস্ক্রিন ও রেডিনেস সেটআপ
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
  </script>
</body>
</html>
